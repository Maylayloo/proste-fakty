services:
  postgres:
    image: postgres:17
    env_file: .env.docker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Seed data (incl. Gemini-generated texts); postgres loads it only when the volume is empty
      - ./db/seed.sql:/docker-entrypoint-initdb.d/01_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333" # REST + dashboard at http://localhost:6333/dashboard
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: ./backend
    env_file: .env.docker
    environment:
      # Secret lives only in the gitignored root .env, which compose reads for ${...}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv # keep the container's venv, don't overwrite it with the host one
      - hf_cache:/root/.cache/huggingface # embedding model (bge-m3) downloaded once
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  # frontend:
  #   build: ./frontend
  #   env_file: .env.docker
  #   ports:
  #     - "5173:5173"
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules
  #   depends_on:
  #     - backend

  # Celery is set up but not used yet: `docker compose --profile celery up`
  redis:
    image: redis:7-alpine
    profiles: [celery]
    ports:
      - "6379:6379"

  celery-worker:
    build: ./backend
    profiles: [celery]
    env_file: .env.docker
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    command: celery -A app.celery_app worker --loglevel=info --concurrency=1
    volumes:
      - ./backend:/app
      - /app/.venv
      - hf_cache:/root/.cache/huggingface
    depends_on: [redis, postgres, qdrant]

  celery-beat:
    build: ./backend
    profiles: [celery]
    env_file: .env.docker
    command: celery -A app.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app
      - /app/.venv
    depends_on: [redis]

volumes:
  postgres_data:
  qdrant_data:
  hf_cache:
